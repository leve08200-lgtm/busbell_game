<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusBell Game - Score</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        background: #f9f9f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px;
      }
      h1 {
        font-size: 2rem;
        color: rgb(32, 33, 47);
        margin-bottom: 6px;
      }
      .subtitle {
        color: #8a8f8e;
        font-size: 0.95rem;
        margin-bottom: 32px;
      }
      .board {
        width: 100%;
        max-width: 540px;
        background: #fff;
        border-radius: 8px;
        /* box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1); */
        overflow: hidden;
      }
      .board-header {
        background: #1d1d26;
        color: #fff;
        padding: 16px 24px;
        font-size: 1.1rem;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
      }
      .entry {
        display: flex;
        align-items: center;
        padding: 14px 24px;
        border-bottom: 1px solid #f9f9f9;
      }
      .entry:last-child {
        border-bottom: none;
      }
      .rank {
        font-size: 1.4rem;
        width: 44px;
        font-weight: bold;
        color: #899696;
      }
      .rank.gold {
        color: #fdce33;
      }
      .rank.silver {
        color: #b0bec1;
      }
      .rank.bronze {
        color: #db994d;
      }
      .name {
        flex: 1;
        font-size: 1rem;
        color: #16161a;
        font-weight: 500;
      }
      .score {
        font-size: 1.2rem;
        font-weight: bold;
        color: #d92c4f;
        margin-right: 16px;
      }
      .date {
        font-size: 0.8rem;
        color: #b2b8b8;
        min-width: 72px;
        text-align: right;
      }
      .empty {
        padding: 48px;
        text-align: center;
        color: #c9cbcb;
        font-size: 1rem;
        line-height: 1.8;
      }
      .loading {
        padding: 40px;
        text-align: center;
        color: #c9cbcb;
      }
      .btn {
        margin-top: 20px;
        padding: 12px 32px;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        color: #fff;
        text-decoration: none;
        display: inline-block;
      }
      .btn-refresh {
        background: #f33359;
      }
      .btn-refresh:hover {
        background: #e2264b;
      }
      .btn-back {
        background: rgb(48, 49, 67);
        margin-top: 12px;
      }
      .btn-back:hover {
        background: rgb(32, 33, 47);
      }
      .btns {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>Bus Bell Game</h1>
    <p class="subtitle">전체 플레이어 상위 5명</p>

    <div class="board">
      <div class="board-header">
        <span>Player</span>
        <span>Score</span>
      </div>
      <div id="boardList"><div class="loading">Loading...</div></div>
    </div>

    <div class="btns">
      <button class="btn btn-refresh" onclick="loadBoard()">새로고침</button>
      <a class="btn btn-back" href="index.html">← 게임으로 돌아가기</a>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        getDocs,
        query,
        orderBy,
        limit,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCwCawEbOgdv6ho_m5nKmadQDe1UcZ8Qsk",
        authDomain: "busbellgame.firebaseapp.com",
        projectId: "busbellgame",
        storageBucket: "busbellgame.firebasestorage.app",
        messagingSenderId: "407202848461",
        appId: "1:407202848461:web:ebc53269d1b559770b1384",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const rankLabel = ["1위", "2위", "3위", "4위", "5위"];
      const rankClass = ["gold", "silver", "bronze", "", ""];

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      async function loadBoard() {
        const list = document.getElementById("boardList");
        list.innerHTML = '<div class="loading">불러오는 중...</div>';
        try {
          const q = query(
            collection(db, "scores"),
            orderBy("score", "desc"),
            limit(5),
          );
          const snap = await getDocs(q);
          if (snap.empty) {
            list.innerHTML =
              '<div class="empty">아직 기록이 없어요!<br>게임을 플레이하고 이름을 남겨보세요 🎮</div>';
            return;
          }
          let html = "";
          snap.docs.forEach((doc, i) => {
            const d = doc.data();
            html += `
            <div class="entry">
              <div class="rank ${rankClass[i]}">${rankLabel[i]}</div>
              <div class="name">${esc(d.name)}</div>
              <div class="score">${d.score}점</div>
              <div class="date">${d.date || ""}</div>
            </div>`;
          });
          list.innerHTML = html;
        } catch (e) {
          list.innerHTML = `<div class="empty">불러오기 실패 😢<br>${e.message}</div>`;
        }
      }

      window.loadBoard = loadBoard;
      loadBoard();
    </script>
  </body>
</html>
