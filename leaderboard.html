<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusBell Game - Score</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Gowun Dodum", sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        min-height: 100vh;
        background: #ffffff;
      }
      h1 {
        font-size: 1.3rem;
        color: rgb(32, 33, 47);
        margin-top: 100px;
        /*margin-bottom: 6px;*/
      }
      .subtitle {
        position: absolute;
        top: 22%;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        font-size: 1.4vw;
        font-weight: bold;
        color: #131416;
      }
      .wrapper {
        position: relative;
        width: 58.9vw;
        aspect-ratio: 840 / 700;
        height: auto;
        background: url("scoreScreen.png") no-repeat center / contain;
        margin: 0 auto;
      }
      .board-header {
        color: #191818;
        padding: 100px 24px;
        left: 50%;
        font-size: 1.1vw;
        font-weight: bold;
        display: flex;
        text-align: center;
      }
      .board-list {
        position: absolute;
        top: 28%;
        left: 50%;
        transform: translateX(-50%);
        width: 40%;
        text-align: center;
      }
      .entry {
        display: flex;
        align-items: center;
        padding: 1.4vw 1.4vw;
        border-bottom: 1px solid #161515;
      }
      .entry:last-child {
        border-bottom: none;
      }
      .rank {
        font-size: 1.3vw;
        width: 3vw;
        font-weight: bold;
        color: #899696;
      }
      .rank.gold {
        color: #fdce33;
      }
      .rank.silver {
        color: #b0bec1;
      }
      .rank.bronze {
        color: #db994d;
      }
      .name {
        flex: 1;
        font-size: 1.1vw;
        color: #16161a;
        font-weight: 500;
      }
      .score {
        font-size: 1.2vw;
        font-weight: bold;
        color: #d92c4f;
        margin-right: 0.7vw;
      }
      .date {
        font-size: 0.8vw;
        color: #b2b8b8;
        min-width: 4vw;
        text-align: right;
      }
      .empty {
        padding: 48px;
        text-align: center;
        color: #c9cbcb;
        font-size: 1rem;
        line-height: 1.8;
      }
      .loading {
        padding: 40px;
        text-align: center;
        color: #c9cbcb;
      }
      .btn {
        margin-top: 20px;
        padding: 12px 32px;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        font-family: "Gowun Dodum", sans-serif;
        color: #151516;
        text-decoration: none;
        display: inline-block;
        transition: transform 0.15s ease;
      }
      .btn:hover {
        transform: scale(1.03);
      }

      .btn-refresh {
        background: url("button1.png") no-repeat center / contain;
      }
      .btn-refresh:hover {
        background: url("button1.png") no-repeat center / contain;
      }
      .btn-back {
        background: url("button2.png") no-repeat center / contain;
        margin-top: 12px;
      }
      .btn-back:hover {
        background: url("button2.png") no-repeat center / contain;
      }
      .btns {
        position: fixed;
        right: 40px; /* 오른쪽 여백 조절 */
        bottom: 40px; /* 아래 여백 조절 */
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: flex-end;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--<h1 class="subtitle">전체 플레이어 상위 5명</h1>-->
    <div class="wrapper">
      <p class="subtitle">전체 플레이어 상위 5명</p>
      <div class="board-list" id="boardList"></div>
    </div>

    <div class="btns">
      <button class="btn btn-refresh" onclick="loadBoard()">새로고침</button>
      <a class="btn btn-back" href="index.html">돌아가기</a>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getFirestore,
        collection,
        getDocs,
        query,
        orderBy,
        limit,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCwCawEbOgdv6ho_m5nKmadQDe1UcZ8Qsk",
        authDomain: "busbellgame.firebaseapp.com",
        projectId: "busbellgame",
        storageBucket: "busbellgame.firebasestorage.app",
        messagingSenderId: "407202848461",
        appId: "1:407202848461:web:ebc53269d1b559770b1384",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const rankLabel = ["1위", "2위", "3위", "4위", "5위"];
      const rankClass = ["gold", "silver", "bronze", "", ""];

      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      async function loadBoard() {
        const list = document.getElementById("boardList");
        list.innerHTML = '<div class="loading">불러오는 중...</div>';
        try {
          const q = query(
            collection(db, "scores"),
            orderBy("score", "desc"),
            limit(5),
          );
          const snap = await getDocs(q);
          if (snap.empty) {
            list.innerHTML =
              '<div class="empty">아직 기록이 없어요!<br>게임을 플레이하고 이름을 남겨보세요</div>';
            return;
          }
          let html = "";
          snap.docs.forEach((doc, i) => {
            const d = doc.data();
            html += `
            <div class="entry">
              <div class="rank ${rankClass[i]}">${rankLabel[i]}</div>
              <div class="name">${esc(d.name)}</div>
              <div class="score">${d.score}점</div>
              <div class="date">${d.date || ""}</div>
            </div>`;
          });
          list.innerHTML = html;
        } catch (e) {
          list.innerHTML = `<div class="empty">불러오기 실패<br>${e.message}</div>`;
        }
      }

      window.loadBoard = loadBoard;
      loadBoard();
    </script>
  </body>
</html>
